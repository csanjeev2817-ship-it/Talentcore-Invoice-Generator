<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalentCore Invoice Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1b2133;--muted:#6b7385;--accent:#4f46e5;--line:#e4e7ef;--ok:#16a34a;--sh:0 1px 3px rgba(20,25,50,.08),0 8px 24px rgba(20,25,50,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0f121a;--card:#181d2a;--text:#e9ecf5;--muted:#99a1b5;--accent:#8b87ff;--line:#2a3144;--sh:none}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:700;display:flex;align-items:center;gap:8px}.brand small{font-weight:400;color:var(--muted);font-size:11px}
.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#4f46e5)}
.top nav{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:10px}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
.tab.on{background:var(--card);color:var(--accent);box-shadow:var(--sh)}
.wrap{display:grid;grid-template-columns:380px 1fr;gap:18px;max-width:1240px;margin:0 auto;padding:16px}
@media(max-width:900px){.wrap{grid-template-columns:1fr;padding:10px 10px 90px}}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh);align-self:start}
.panel h1{font-size:17px;margin:0 0 4px}
.panel h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 0;padding-top:14px;border-top:1px solid var(--line)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.panel input,.panel select,.panel textarea,#q,#fp{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:14px}
.panel input:focus,.panel select:focus,.panel textarea:focus,#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
@media(max-width:900px){.panel input,.panel select,.panel textarea,#q,#fp{font-size:16px}}
textarea{min-height:110px;resize:vertical}
.item{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;background:var(--bg)}
.item input{background:var(--card)!important}
.item .g{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:6px;align-items:end}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.btn.sec{width:100%;margin-top:10px;background:transparent;color:var(--accent);border:1px dashed var(--accent);font-size:13px;padding:9px}
.x{border:0;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:10px 12px;cursor:pointer}
.dock{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;margin:18px -16px -16px;padding:12px 16px;background:var(--card);border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.dock div{display:flex;flex-direction:column;font-size:12px;color:var(--muted)}.dock b{font-size:18px;color:var(--text)}.dock .btn{flex:1}
@media(max-width:900px){.dock{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:0;z-index:6}}
#pvw{overflow:hidden;border-radius:10px}
.dwrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:4px}
.card h2{font-size:15px;margin:0 0 10px}
.dh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.dh h2{margin:0;flex:1 0 100%}
.dh #q{flex:1;min-width:180px;width:auto}.dh #fp{width:auto}
.tw{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt tr.cl{cursor:pointer}.dt tr.cl:hover td{background:var(--bg)}
.tag{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#eef2ff;color:#4338ca}
.tag.Elite{background:#fef3c7;color:#92400e}.tag.Premium{background:#fce7f3;color:#9d174d}.tag.Monthly{background:#dcfce7;color:#166534}.tag.One-Time{background:#e0f2fe;color:#075985}
.bar2{height:6px;background:var(--line);border-radius:9px;overflow:hidden;min-width:90px;margin-top:4px}.bar2 i{display:block;height:100%;background:var(--ok)}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
#login{display:flex;position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;z-index:9}
#lbox{background:var(--card);padding:22px;border-radius:14px;width:320px;border:1px solid var(--line);box-shadow:var(--sh)}
#login input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px}
.preview{display:block}
.inv{background:#fff;color:#000;width:210mm;min-height:296mm;margin:0 auto;padding:11mm 10mm;font-family:Carlito,Calibri,Arial,sans-serif;font-size:11px;line-height:1.35}
.inv .box{border:1.5px solid #000}
.inv .hd{display:grid;grid-template-columns:90px 1fr 235px;border:1.5px solid #000;border-bottom:0;align-items:center}
.inv .hd img{width:62px;margin:8px auto;display:block}
.inv .hd .nm{font-size:19px;font-weight:700;text-align:center}
.inv .hd .ad{border-left:1.5px solid #000;padding:8px;text-align:right;font-size:10.5px;align-self:stretch;display:flex;align-items:center;justify-content:flex-end}
.inv .r2{display:flex;justify-content:space-between;border:1.5px solid #000;border-bottom:0;padding:3px 4px;font-weight:700}
.inv .r2 b{font-size:15px}
.inv .exp{border:1.5px solid #000;border-bottom:0;text-align:center;font-weight:700;font-size:10px;padding:3px 6px}
.inv .r3{display:flex;justify-content:space-between;border:1.5px solid #000;border-bottom:0;padding:2px 4px;font-weight:700}
.inv .bar{background:#000;color:#fff;font-weight:700;padding:4px;border-left:1.5px solid #000;border-right:1.5px solid #000}
.inv .kv{display:grid;grid-template-columns:130px 1fr;border:1px solid #aaa;border-top:0;border-left:1.5px solid #000;border-right:1.5px solid #000}
.inv .kv>div{padding:5px;border-top:1px solid #ccc}.inv .kv>div:nth-child(odd){font-weight:700;background:#f2f2f2}
.inv table{width:100%;border-collapse:collapse;border:1.5px solid #000;border-top:0}
.inv th{background:#000;color:#fff;padding:5px;font-size:11px}
.inv td{padding:7px 5px;border:1px solid #ccc;vertical-align:middle}
.inv tr:nth-child(even) td{background:#f4f4f4}
.inv .c{text-align:center}.inv .rt{text-align:right}
.inv .tot{display:grid;grid-template-columns:1fr 110px;border-left:1.5px solid #000;border-right:1.5px solid #000;border-top:1px solid #aaa}
.inv .tot>div{padding:5px;text-align:right;border-bottom:1px solid #ccc}
.inv .tot .gt{background:#000;color:#fff;font-weight:700}
.inv .bn{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid #000;border-top:0}
.inv .bn .l .kv{border:0;grid-template-columns:110px 1fr}
.inv .nt{padding:5px;font-size:9px;white-space:pre-line;border-left:1px solid #aaa}
.inv .sg{border:1.5px solid #000;border-top:0;display:grid;grid-template-columns:1fr 1fr}
.inv .sg img{height:34px;margin:4px 8px}
.inv .sg .ln{padding:4px 6px;border-top:1px solid #ccc}
.inv .sg .fr{display:flex;align-items:flex-end;justify-content:flex-end;padding:6px;font-weight:700;font-style:italic;border-left:1px solid #ccc}
.dl{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:8px;padding:5px 9px;font-weight:600;cursor:pointer;font-size:12px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600}
#stt{color:var(--ok)!important;font-weight:600}
.spin{display:inline-block;width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-.15em;margin-right:7px}
.spin.big{width:36px;height:36px;border-width:3px;margin:0;color:var(--accent)}
.spin.sm{margin-right:0}
@keyframes sp{to{transform:rotate(360deg)}}
.btn:disabled{opacity:.75;cursor:wait}
.ld{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);font-size:14px}
#inv{transform-origin:top left}
#lerr:empty{display:none}
</style>
</head>
<body>
<div id="login"><div class="ld" id="lload"><span class="spin big"></span><span>Loading…</span></div><div id="lbox" style="display:none"><h3 style="margin:0 0 12px">TalentCore Invoice Login</h3><input id="le" type="email" placeholder="Email" autocomplete="username"><br><br><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><p id="lerr" style="color:#e5484d;font-size:12px"></p><button class="btn" id="lg" style="width:100%">Log in</button></div></div>
<header class="top"><div class="brand"><span class="dot"></span>TalentCore <small id="who"></small></div><nav><button class="tab on" data-v="new">+ New Invoice</button><button class="tab" data-v="dash">Dashboard</button></nav><button class="chip" id="lo" style="display:none">Log out</button></header>
<div class="wrap" id="vnew">
<div class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center"><h1>Invoice Details</h1><button class="chip" id="newb">↺ New invoice</button></div>
  <label>Plan &amp; Invoice Type</label><select id="type"></select>
  <div id="mowrap" style="display:none"><label>Service Month</label><input id="mo" type="month"></div>
  <h3>Client</h3>
  <label>Client Name</label><input id="cn" list="cl" autocomplete="off"><datalist id="cl"></datalist>
  <div id="hist" class="hint"></div>
  <label>Country</label><input id="cc" value="USA">
  <label>Email</label><input id="ce" type="email">
  <h3>Services</h3>
  <div id="items"></div>
  <button class="btn sec" id="add">+ Add line</button>
  <h3>Invoice Info</h3>
  <label>Invoice # (auto-generated, editable)</label><input id="no">
  <label>Invoice Date</label><input id="dt" type="date">
  <h3>Payment Details</h3>
  <label>Mode of Payment</label><select id="pm"></select>
  <label>Bank Name</label><input id="bk">
  <label>Account No.</label><input id="ac">
  <label>IFSC / SWIFT Code</label><input id="if">
  <h3>Notes &amp; Terms</h3>
  <textarea id="nt" readonly></textarea>
  <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="unl" style="width:auto"> Unlock to edit</label>
  <div class="dock"><div><small>Total</small><b id="tt">$0.00</b><small id="stt"></small></div><button class="btn" id="pdf">Download PDF</button></div>
</div>
<div id="pvw"><div id="inv" class="inv"></div></div>
</div>
<div id="vdash" style="display:none"><div class="dwrap"><div class="stats" id="stats"></div>
<div class="card"><h2>Pending upfront installments</h2><div id="pend"></div></div>
<div class="card"><div class="dh"><h2>All invoices</h2><input id="q" placeholder="Search client, invoice #, type…"><select id="fp"><option value="">All plans</option><option>Standard</option><option>Elite</option><option>Premium</option><option>One-Time</option><option>Monthly</option></select></div><div class="tw"><table class="dt" id="lt"></table></div></div></div></div>

function ord(d){const n=d.getDate(),s=(n%10==1&&n!=11)?"st":(n%10==2&&n!=12)?"nd":(n%10==3&&n!=13)?"rd":"th";return d.toLocaleString("en-US",{month:"long"})+" "+n+s+", "+d.getFullYear()}
async function refreshNo(pre){if(manualNo)return;const f=fyOf(dtv());let last=0;
 if(pre!=null)last=pre;else if(API){try{last=(await call("next",{fy:f})).last}catch(e){}}else{try{last=+localStorage.getItem("L"+f)||0}catch(e){}}
 $("no").value=CO.prefix+"-"+String(last+1).padStart(4,"0")+"/"+f;render()}
function monthLabel(){const v=$("mo").value;return v?new Date(v+"-01T00:00:00").toLocaleString("en-US",{month:"long"})+", "+v.slice(0,4):"[Month, Year]"}
function setNote(){const u=$("unl").checked;if(!u)$("nt").value=cur.note.replace("{M}",monthLabel());$("nt").readOnly=!u}
function hist(){const c=CLIENTS.find(c=>c.name.toLowerCase()==$("cn").value.trim().toLowerCase());
 if(!c){$("hist").innerHTML="";return null}
 const P=PLANS[cur.plan],up=c.rows.filter(r=>r.kind=="up"),sum=up.reduce((s,r)=>s+ +r.amt,0);
 $("hist").innerHTML=`<b>${esc(c.name)}</b> – ${c.rows.length} invoice(s) already created<br>`+c.rows.map(r=>`${esc(r.no)} · ${esc(r.type)} · $${f2(r.amt)}`).join("<br>")
  +(P&&cur.kind=="up"?`<br><b>Upfront: ${up.length} installment(s), $${f2(sum)} / $${f2(P.up)} → remaining $${f2(P.up-sum)}</b>`:"");return c}
function setType(){cur=CAT[$("type").value];if(!items[0].desc||items[0].desc===lastDesc){items[0].desc=cur.desc;drawItems()}
 lastDesc=cur.desc;$("mowrap").style.display=cur.kind=="mo"?"block":"none";setNote();hist();render()}
function drawItems(){$("items").innerHTML=items.map((it,i)=>`<div class="item"><input data-i="${i}" data-k="desc" placeholder="Description of service" value="${esc(it.desc)}">
 <div class="g"><div><label style="margin:0">Qty</label><input data-i="${i}" data-k="qty" type="number" step="any" value="${esc(it.qty)}"></div>
 <div><label style="margin:0">Rate (USD)</label><input data-i="${i}" data-k="rate" type="number" step="0.01" value="${esc(it.rate)}"></div>
 <button class="x" data-del="${i}">✕</button></div></div>`).join("")}
const total=()=>items.reduce((s,r)=>s+(+r.qty||0)*(+r.rate||0),0);
function invHTML(s){const dt=new Date(s.date+"T00:00:00"),rows=s.items.map(it=>({d:it.desc,q:+it.qty||0,r:+it.rate||0}));
 while(rows.length<5)rows.push({d:"",q:0,r:0,empty:true});const sub=rows.reduce((x,r)=>x+r.q*r.r,0);
 return `
 <div class="hd"><img src="${LOGO}"><div class="nm">${CO.name}</div><div class="ad">${esc(CO.addr).replace(/\n/g,"<br>")}</div></div>
 <div class="r2"><b>TAX INVOICE</b><span>GSTIN: ${CO.gstin}</span></div>
 <div class="exp">${esc(CO.export)}</div>
 <div class="r3"><span>Invoice #: &nbsp;${esc(s.no)}</span><span>Invoice Date: &nbsp;${ord(dt)}</span></div>
 <div class="bar">BILLED TO</div>
 <div class="kv"><div>Client:</div><div>${esc(s.cn)}</div><div>Country:</div><div>${esc(s.cc)}</div><div>Email:</div><div>${esc(s.ce)}</div><div>Place of Supply:</div><div>${CO.place}</div></div>
 <table><tr><th style="width:34px">#</th><th>Description of Service</th><th style="width:70px">HSN/SAC</th><th style="width:55px">Qty.</th><th style="width:85px">Rate (USD)</th><th style="width:95px">Amount (USD)</th></tr>
 ${rows.map((r,i)=>`<tr><td class="c">${i+1}</td><td>${esc(r.d)}</td><td></td><td class="c">${f2(r.q)}</td><td class="rt">${f2(r.r)}</td><td class="rt">${r.empty?"":f2(r.q*r.r)}</td></tr>`).join("")}</table>
 <div class="tot"><div>Subtotal (USD)</div><div>${f2(sub)}</div><div>GST Rate (%)</div><div>0%</div><div>Tax (GST @ 0% – Export of Services)</div><div>0.00</div><div class="gt">GRAND TOTAL (USD)</div><div class="gt">${f2(sub)}</div></div>
 <div class="bar" style="display:grid;grid-template-columns:1fr 1fr;text-align:center"><span>BANK / PAYMENT DETAILS</span><span>NOTES &amp; TERMS</span></div>
 <div class="bn"><div class="l"><div class="kv"><div>Mode of Payment:</div><div>${esc(s.pm)}</div><div>Bank Name:</div><div>${esc(s.bk)}</div><div>Account No.:</div><div>${esc(s.ac)}</div><div>IFSC / SWIFT Code:</div><div>${esc(s.if)}</div></div></div><div class="nt">${esc(s.nt)}</div></div>
 <div class="sg"><div><img src="${SIGN}"><div class="ln"><b>Authorised Signatory</b></div><div class="ln">Name: ${CO.signer}</div><div class="ln">Designation: ${CO.desg}</div></div><div class="fr">For TALENT CORE TECHNOLOGIES</div></div>`}

function state(){return{date:$("dt").value||new Date().toISOString().slice(0,10),items:items.map(i=>({desc:i.desc,qty:i.qty,rate:i.rate})),no:$("no").value,cn:$("cn").value,cc:$("cc").value,ce:$("ce").value,pm:$("pm").value,bk:$("bk").value,ac:$("ac").value,if:$("if").value,nt:$("nt").value}}
function render(){$("inv").innerHTML=invHTML(state());fit()}
let draft=null,draftClient="";
function setDraft(no){draft=no||null;draftClient=no?$("cn").value.trim():"";$("no").readOnly=!!no;$("stt").textContent=no?" ✓ "+no+" saved":""}
function resetForm(){items=[{desc:cur.desc,qty:1,rate:""}];lastDesc=cur.desc;["cn","ce","mo"].forEach(i=>$(i).value="");$("cc").value="USA";$("unl").checked=false;
 manualNo=false;setDraft(null);drawItems();$("hist").innerHTML="";setNote();refreshNo()}
async function makePDF(s){
 if(typeof html2pdf==="undefined")throw new Error("The PDF library failed to load. Check your internet connection and reload the page.");
 // Build the invoice in a visible, viewport-aligned staging area so html2canvas
 // doesn't calculate a negative/off-screen crop. Let html2pdf determine its canvas width.
 const w=document.createElement("div");
 w.style.cssText="position:fixed;left:0;top:0;width:210mm;max-width:210mm;z-index:99999;opacity:0;pointer-events:none;background:#fff;overflow:visible";
 const c=document.createElement("div");c.className="inv";c.style.cssText="margin:0!important;width:210mm!important;min-width:210mm!important;max-width:210mm!important;transform:none!important;box-sizing:border-box!important;background:#fff!important";
 c.innerHTML=invHTML(s);w.appendChild(c);document.body.appendChild(w);
 const file=s.no.replace(/\//g,"_")+"_"+s.cn.trim().replace(/\s+/g,"_")+".pdf";
 try{
  await Promise.all([...c.querySelectorAll("img")].map(i=>i.decode?i.decode().catch(()=>{}):null));
  await html2pdf().set({margin:0,filename:file,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true,logging:false,scrollX:0,scrollY:0,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"]}}).from(c).save();
 }finally{w.remove()}}

function rebuild(r){const k=CAT.find(c=>c.plan==r.plan&&c.type==r.type)||{desc:r.type,note:""},p=PAYS.find(x=>x.mode==r.mode)||{};
 return{date:ymd(r.date),items:[{desc:k.desc,qty:1,rate:r.amt}],no:r.no,cn:r.client,cc:r.country||"USA",ce:r.email||"",pm:r.mode,bk:p.bank||"",ac:p.ac||"",if:p.ifsc||"",nt:(k.note||"").replace("{M}",r.month||"[Month, Year]")}}
async function dlOld(b){const r=LIST.find(x=>x.no==b.dataset.no),h=b.innerHTML;b.innerHTML='<span class="spin sm"></span>';b.disabled=true;
 try{let s=null;if(API){const g=await call("get",{no:r.no});if(g.data)s=JSON.parse(g.data)}
  if(!s)s=rebuild(r);s.no=r.no;await makePDF(s)}catch(e){alert("Error: "+e.message)}
 b.innerHTML=h;b.disabled=false}
function fillPay(){const p=PAYS.find(x=>x.mode==$("pm").value)||{};$("bk").value=p.bank||"";$("ac").value=p.ac||"";$("if").value=p.ifsc||"";render()}
async function init(){let r={payments:DEFPAY,clients:[]},last=null;if(API){let n;[r,n]=await Promise.all([call("init"),call("next",{fy:fyOf(dtv())}).then(x=>x.last).catch(()=>null)]);last=n}
 PAYS=r.payments;CLIENTS=r.clients;$("login").style.display="none";if(r.name)$("who").textContent="· "+r.name;
 $("pm").innerHTML=PAYS.map(p=>`<option>${esc(p.mode)}</option>`).join("");const d=PAYS.find(p=>p.mode=="PayGlocal");if(d)$("pm").value="PayGlocal";
 $("cl").innerHTML=CLIENTS.map(c=>`<option value="${esc(c.name)}">`).join("");fillPay();setType();refreshNo(last);if(API)$("lo").style.display=""}
$("type").onchange=setType;$("mo").oninput=()=>{setNote();render()};$("unl").onchange=setNote;$("pm").onchange=fillPay;
$("items").addEventListener("input",e=>{const i=e.target.dataset.i;if(i==null)return;items[i][e.target.dataset.k]=e.target.value;render()});
$("items").addEventListener("click",e=>{const d=e.target.dataset.del;if(d==null)return;items.splice(+d,1);if(!items.length)items=[{desc:"",qty:1,rate:""}];drawItems();render()});
$("add").onclick=()=>{items.push({desc:"",qty:1,rate:""});drawItems()};
$("cn").onchange=()=>{const c=hist();if(c){$("cc").value=c.country||"USA";$("ce").value=c.email||""}render()};
$("cn").oninput=()=>{hist();render()};
$("no").oninput=()=>{manualNo=true;render()};$("dt").onchange=()=>{refreshNo()};
["cc","ce","bk","ac","if","nt"].forEach(id=>$(id).addEventListener("input",render));
async function doLogin(){const b=$("lg"),h=b.innerHTML;$("lerr").textContent="";
 if(!$("le").value.trim()||!$("lp").value){$("lerr").textContent="Please enter your email and password.";return}
 b.disabled=true;b.innerHTML='<span class="spin"></span>Signing in…';
 try{const r=await call("login",{email:$("le").value,pw:$("lp").value});TOKEN=r.token;try{localStorage.setItem(TK,TOKEN)}catch(e){}
  $("lp").value="";$("lbox").style.display="none";$("lload").style.display="flex";await init()}
 catch(e){showLogin(e.message)}
 b.disabled=false;b.innerHTML=h}
$("lg").onclick=doLogin;$("lp").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});$("le").addEventListener("keydown",e=>{if(e.key==="Enter")$("lp").focus()});
$("lo").onclick=()=>logout("");
$("pdf").onclick=async()=>{
 const b=$("pdf"),txt=b.innerHTML;if(!$("cn").value.trim())return alert("Please enter the client name.");
 if(draft&&$("cn").value.trim()!=draftClient)return alert(draft+" belongs to '"+draftClient+"'.\nClick '↺ New invoice' first to bill a different client.");
 const s=state();
 const rec={no:draft||(manualNo?s.no:""),update:!!draft,date:s.date,client:s.cn.trim(),country:s.cc,email:s.ce,plan:cur.plan,type:cur.type,kind:cur.kind,amt:total(),mode:s.pm,month:cur.kind=="mo"?monthLabel():"",data:JSON.stringify(s)};
 b.disabled=true;
 try{b.innerHTML='<span class="spin"></span>Saving…';
  if(API){const r=await Promise.race([call("save",{rec}),new Promise((_,j)=>setTimeout(()=>j(new Error("The server did not respond within 30 seconds")),30000))]);s.no=r.no}
  else{try{const m=s.no.match(/-(\d+)\/(.+)$/);localStorage.setItem("L"+m[2],+m[1])}catch(e){}}
  $("no").value=s.no;setDraft(s.no);render();b.innerHTML='<span class="spin"></span>Generating PDF…';
  await makePDF(s);
 }catch(e){alert("Error: "+e.message)}
 b.innerHTML=txt;b.disabled=false;
 if(API)call("init").then(r=>{CLIENTS=r.clients;hist()}).catch(()=>{})};
$("newb").onclick=()=>{if(draft||$("cn").value.trim()){if(!confirm("Clear the form and start a new invoice?"))return}resetForm()};
$("dt").value=new Date().toISOString().slice(0,10);drawItems();
let LIST=[];
const ymd=s=>String(s).slice(0,10);
const fd=s=>new Date(ymd(s)+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
function fit(){const p=$("pvw");$("tt").textContent="$"+f2(total());if(p.dataset.cap)return;const s=Math.min(1,(p.clientWidth-2)/794),i=$("inv");i.style.transform=`scale(${s})`;p.style.height=i.offsetHeight*s+"px"}
function showView(v){$("vnew").style.display=v=="new"?"":"none";$("vdash").style.display=v=="dash"?"":"none";
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.v==v));if(v=="new")fit();else loadDash()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showView(b.dataset.v));
async function loadDash(){if(API){$("stats").innerHTML='<div class="hint" style="grid-column:1/-1"><span class="spin"></span>Loading dashboard…</div>';$("pend").innerHTML="";$("lt").innerHTML="";try{LIST=(await call("list")).rows}catch(e){$("stats").innerHTML="<p>"+esc(e.message)+"</p>";return}}drawDash()}
function drawDash(){
 const now=new Date(),mk=now.toISOString().slice(0,7),fy=fyOf(now),sum=a=>a.reduce((s,r)=>s+ +r.amt,0);
 const g={};LIST.forEach(r=>{const p=g[r.client.toLowerCase()]=g[r.client.toLowerCase()]||{name:r.client,plan:"",paid:0,n:0};if(PLANS[r.plan])p.plan=r.plan;if(r.kind=="up"){p.paid+= +r.amt;p.n++}});
 const pl=Object.values(g).filter(p=>p.plan&&PLANS[p.plan].up-p.paid>0.005);
 $("stats").innerHTML=[["This month",sum(LIST.filter(r=>ymd(r.date).startsWith(mk)))],["FY "+fy,sum(LIST.filter(r=>fyOf(new Date(ymd(r.date)+"T00:00:00"))==fy))],["Invoices",LIST.length],["Pending upfront",pl.reduce((s,p)=>s+PLANS[p.plan].up-p.paid,0)]]
  .map(([a,b])=>`<div class="stat"><span>${a}</span><b>${a=="Invoices"?b:"$"+f2(b)}</b></div>`).join("");
 $("pend").innerHTML=pl.length?`<div class="tw"><table class="dt"><tr><th>Client</th><th>Plan</th><th>Installments</th><th>Paid</th><th>Remaining</th><th></th></tr>`+pl.map(p=>{const t=PLANS[p.plan].up;
  return `<tr class="cl" data-c="${esc(p.name)}"><td>${esc(p.name)}</td><td><span class="tag ${p.plan}">${p.plan}</span></td><td>${p.n}</td><td>$${f2(p.paid)} / $${f2(t)}<div class="bar2"><i style="width:${Math.min(100,p.paid/t*100)}%"></i></div></td><td><b>$${f2(t-p.paid)}</b></td><td>Invoice →</td></tr>`}).join("")+"</table></div>":"<span class='hint'>No pending upfront installments 🎉</span>";
 const q=$("q").value.toLowerCase(),f=$("fp").value;
 const rows=LIST.filter(r=>(!f||r.plan==f)&&(!q||[r.no,r.client,r.type,r.email,r.mode].join(" ").toLowerCase().includes(q))).sort((a,b)=>ymd(b.date).localeCompare(ymd(a.date))||String(b.no).localeCompare(String(a.no)));
 $("lt").innerHTML=`<tr><th>#</th><th>Date</th><th>Client</th><th>Type</th><th>Amount</th><th>Mode</th><th></th></tr>`+(rows.map(r=>`<tr class="cl" data-c="${esc(r.client)}"><td>${esc(r.no)}</td><td>${fd(r.date)}</td><td>${esc(r.client)}</td><td><span class="tag ${r.plan}">${esc(r.type)}</span></td><td>$${f2(r.amt)}</td><td>${esc(r.mode)}</td><td><button class="dl" data-no="${esc(r.no)}">⬇ PDF</button></td></tr>`).join("")
  ||`<tr><td colspan="7" class="hint">${API?"No invoices found":"Demo mode: invoices will appear here once the Google Sheet is connected"}</td></tr>`)}
$("vdash").addEventListener("click",e=>{const d=e.target.closest(".dl");if(d){dlOld(d);return}const tr=e.target.closest("tr.cl");if(!tr)return;const c=LIST.find(r=>r.client==tr.dataset.c)||{};
 $("cn").value=tr.dataset.c;$("cc").value=c.country||"USA";$("ce").value=c.email||"";showView("new");hist();render()});
$("q").oninput=drawDash;$("fp").onchange=drawDash;window.addEventListener("resize",fit);
(async()=>{
 if(!API){$("login").style.display="none";return init()}
 // Wake up the Apps Script server while the user is typing credentials (reduces cold-start delay)
 fetch(API,{method:"POST",body:JSON.stringify({action:"ping"})}).catch(()=>{});
 try{TOKEN=localStorage.getItem(TK)||""}catch(e){}
 if(!TOKEN)return showLogin();
 try{await init()}catch(e){if($("lbox").style.display==="none")showLogin(e.message)}
})();
</script>
</body>
</html>
